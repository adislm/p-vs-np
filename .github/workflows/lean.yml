name: lean

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # elan reads lean/lean-toolchain and fetches the pinned version.
      - name: Build
        working-directory: lean
        run: lake build

      # A `sorry` would leave the theorems true-looking but unproved. Fail the
      # build rather than let that reach main.
      - name: Axiom audit
        working-directory: lean
        run: |
          lake env lean PVNP/Audit.lean | tee audit.txt
          if grep -q sorryAx audit.txt; then
            echo "::error::a theorem depends on sorryAx"
            exit 1
          fi
